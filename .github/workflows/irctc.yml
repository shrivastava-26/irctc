name: IRCTC Automation

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
  pull_request:
  workflow_dispatch:
    inputs:
      USERNAME:
        required: true
        type: string
        description: "IRCTC username"
      PASSWORD:
        required: true
        type: string
        description: "IRCTC password"
      BOOKING_REQUEST_JSON:
        required: true
        type: string
        description: "JSON booking request without credentials"
      BROWSER:
        required: false
        default: chromium
        type: string
        description: "Browser for explicit live run"

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm run test:unit
      - name: Build React UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright browser smoke
        run: npm run smoke:playwright
      - name: Verify legacy Cypress package
        run: node -e "console.log(require.resolve('cypress/package.json'))"

  browser-compatibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chrome msedge
      - name: Smoke Chromium
        env:
          BROWSER_CHANNEL: chromium
        run: node tests/browser/playwright.smoke.js
      - name: Smoke Google Chrome
        env:
          BROWSER_CHANNEL: chrome
        run: node tests/browser/playwright.smoke.js
      - name: Smoke Microsoft Edge
        env:
          BROWSER_CHANNEL: msedge
        run: node tests/browser/playwright.smoke.js

  live-booking:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Chromium and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb
          npx playwright install --with-deps chromium
      - name: Validate booking configuration
        env:
          BOOKING_REQUEST_JSON: ${{ inputs.BOOKING_REQUEST_JSON }}
        run: npm run prepare-booking
      - name: Run configured booking workflow
        env:
          IRCTC_USERNAME: ${{ inputs.USERNAME }}
          IRCTC_PASSWORD: ${{ inputs.PASSWORD }}
          BOOKING_REQUEST_JSON: ${{ inputs.BOOKING_REQUEST_JSON }}
          PLAYWRIGHT_BROWSER: ${{ inputs.BROWSER || 'chromium' }}
          PLAYWRIGHT_HEADED: 'true'
        run: xvfb-run -a npm run book
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: irctc-failure-${{ github.run_id }}
          path: artifacts/jobs/
          retention-days: 3
          if-no-files-found: ignore