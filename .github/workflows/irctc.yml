name: IRCTC Automation

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
  pull_request:
  workflow_dispatch:
    inputs:
      USERNAME:
        required: true
        type: string
        description: "IRCTC username"
      PASSWORD:
        required: true
        type: string
        description: "IRCTC password"
      BOOKING_REQUEST_JSON:
        required: true
        type: string
        description: "JSON booking request without credentials"
      BROWSER:
        required: false
        default: chrome
        type: string
        description: "Browser for explicit live run"

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm run test:unit

      - name: Cypress installation check
        run: npx cypress verify

  live-booking:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run configured booking workflow
        env:
          IRCTC_USERNAME: ${{ inputs.USERNAME }}
          IRCTC_PASSWORD: ${{ inputs.PASSWORD }}
          BOOKING_REQUEST_JSON: ${{ inputs.BOOKING_REQUEST_JSON }}
          FAST_MODE: 'true'
          DEBUG_MODE: 'false'
          CYPRESS_BROWSER: ${{ inputs.BROWSER }}
        run: |
          echo "::add-mask::$IRCTC_USERNAME"
          echo "::add-mask::$IRCTC_PASSWORD"
          npm run prepare
          npm run book

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: irctc-failure-${{ github.run_id }}
          path: cypress/screenshots/
          retention-days: 3
          if-no-files-found: ignore
