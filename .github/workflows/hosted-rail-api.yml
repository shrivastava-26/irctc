name: Hosted Rail API CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/hosted-rail-api-execution

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:rail-api
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
